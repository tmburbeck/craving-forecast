name: CI

# Builds and tests on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x

jobs:
  test:
    name: Engine tests + API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run engine tests
        run: dotnet test tests/CravingForecast.Tests --logger "console;verbosity=normal"
      - name: Build API
        run: dotnet build src/CravingForecast.Api

  web:
    name: Web app walk-through
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # push screenshots to the "screenshots" branch
      pull-requests: write   # post them on the pull request
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Publish and start the API with the web app
        run: |
          dotnet publish src/CravingForecast.Api -c Release -o "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          ConnectionStrings__Salus="Data Source=$RUNNER_TEMP/salus.db" Auth__RequestsPerMinute=1000 \
            ASPNETCORE_URLS=http://127.0.0.1:5080 nohup dotnet CravingForecast.Api.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5080/api/health && exit 0; sleep 1; done
          echo "The API didn't start." >&2; cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Walk through the web app and take screenshots
        working-directory: tests/e2e
        run: node walkthrough.mjs http://127.0.0.1:5080 shots
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
      - name: Keep the screenshots with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/shots
          if-no-files-found: ignore
      # Pull requests get a screenshots comment; main refreshes the README gallery. Not for forks (no write access).
      - name: Publish screenshots
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHOWN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/publish-screenshots.sh tests/e2e/shots

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Install Android SDK packages the app needs
        run: >
          dotnet build src/CravingForecast.Mobile -f net10.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - name: Build Android app
        run: dotnet build src/CravingForecast.Mobile -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME"

  windows:
    name: Windows preview
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      # MobileTarget limits the app to Windows, so the Android and iOS workloads aren't needed here.
      - name: Build Windows app
        run: dotnet build src/CravingForecast.Mobile -f net10.0-windows10.0.19041.0 -p:MobileTarget=net10.0-windows10.0.19041.0

  # Publishes the API and web app to Azure App Service after every push to main that passes the tests and the web walk-through.
  # Needs the repository variable AZURE_WEBAPP_NAME and the secret AZURE_WEBAPP_PUBLISH_PROFILE;
  # until they're set, this job is skipped.
  deploy:
    name: Deploy to Azure
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish API and web app
        run: |
          dotnet publish src/CravingForecast.Api -c Release -o publish
          # App Service picks the program to start from *.runtimeconfig.json; more than one and it starts a placeholder site.
          count=$(ls publish/*.runtimeconfig.json | wc -l)
          [ "$count" = 1 ] || { echo "Expected one runtimeconfig.json in the publish output, found $count:" >&2; ls publish/*.runtimeconfig.json >&2; exit 1; }
      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
          # Replace the site's files instead of adding to them, so files from earlier builds can't linger
          # (a leftover *.runtimeconfig.json makes App Service start its placeholder site instead of Salus).
          clean: true
          restart: true
      - name: Check the live API answers
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ steps.deploy.outputs.webapp-url }}/api/health"; then exit 0; fi
            sleep 10
          done
          echo "The deployed API didn't answer /api/health within 2 minutes." >&2
          exit 1
