<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Salus</title>
    <meta name="description" content="Know your cravings before they arrive." />
    <!-- Link previews (LinkedIn, Slack, iMessage...). Crawlers don't run the app, so these must be in the page itself, with absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Salus" />
    <meta property="og:title" content="Salus: know your cravings before they arrive" />
    <meta property="og:description" content="Learns your daily danger zones and nudges you 30 minutes before each one. Works on phone, iPad and desktop." />
    <meta property="og:url" content="https://salus-tmburbeck-bafcfcg0exfpduh6.westus3-01.azurewebsites.net/" />
    <meta property="og:image" content="https://salus-tmburbeck-bafcfcg0exfpduh6.westus3-01.azurewebsites.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Salus on a phone: today's hourly craving risk and danger zones" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F4EDE2" />
    <base href="/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Salus" />
    <link rel="preload" href="fonts/PlusJakartaSans-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <!-- The intro: shown on top of the app while it downloads and starts, and kept on screen for at least a
         few seconds when someone opens Salus, so it greets them instead of flashing past. -->
    <div id="intro" class="splash intro" role="status" aria-label="Welcome to Salus">
        <div class="logo">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#F4EDE2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11 M12 11C12 7 9 4 4 4c0 4 3 7 8 7z M12 14c0-3 2.5-6 7-6 0 3.5-2.5 6-7 6z" /></svg>
        </div>
        <div class="words">
            <span class="greeting" id="greeting">Welcome</span>
            <span class="name">Salus</span>
            <span class="body">Know your cravings before they arrive.</span>
        </div>
        <p class="intro-line">Salus learns when your cravings tend to hit and gives you a heads-up before each one.</p>
        <div class="loader" aria-hidden="true"></div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong. <a href="" class="reload">Reload</a>
        <span class="dismiss" aria-label="Dismiss">×</span>
    </div>

    <script>
        (function () {
            var h = new Date().getHours();
            document.getElementById("greeting").textContent =
                h < 5 ? "Hello, night owl" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";

            // Opening Salus (the Home Screen icon starts at "/") shows the intro for at least this long. A link
            // straight to a screen, like a notification opening the check-in, skips the wait.
            var minimumMs = location.pathname === "/" ? 3500 : 0;
            var intro = document.getElementById("intro"), app = document.getElementById("app");
            function appHasDrawn() { return app.childElementCount > 0; }
            function leave() {
                var wait = Math.max(0, minimumMs - performance.now());
                setTimeout(function () {
                    intro.classList.add("leaving");
                    setTimeout(function () { intro.remove(); }, 600);
                }, wait);
            }
            if (appHasDrawn()) leave();
            else new MutationObserver(function (_, watcher) {
                if (!appHasDrawn()) return;
                watcher.disconnect();
                leave();
            }).observe(app, { childList: true });
        })();
    </script>
    <script>
        // The notifications worker; registering it early means it's ready the moment someone turns notifications on.
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(function () { });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
